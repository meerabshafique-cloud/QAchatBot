<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alarms</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="logo.svg" alt="Logo" class="logo" />
      <h1>Alarms</h1>
      <a href="index.html" class="nav-link">Task Manager</a>
    </div>
    <form id="add-alarm-form">
      <input type="time" id="time-input" required />
      <input type="text" id="label-input" placeholder="Alarm label..." autocomplete="off" required />
      <button type="submit">Add Alarm</button>
    </form>
    <ul id="alarm-list"></ul>
    <div id="alert-banner" class="alert-banner" style="display: none;">
      <div class="alert-content">
        <span id="alert-label"></span>
        <button id="dismiss-btn">Dismiss</button>
      </div>
    </div>
  </div>
  <script src="alarms.js"></script>
</body>
</html>
