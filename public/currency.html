<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>PKR ⇄ USD Converter</h1>
    <p id="rate-display" class="rate-display"></p>
    <form id="convert-form" class="converter-form">
      <input type="number" id="amount-input" placeholder="Amount" step="any" min="0" required />
      <select id="direction-select" class="direction-select">
        <option value="PKR_TO_USD">PKR → USD</option>
        <option value="USD_TO_PKR">USD → PKR</option>
      </select>
      <button type="submit">Convert</button>
    </form>
    <div id="result-box" class="result-box"></div>
    <p><a href="index.html">&larr; Back to TO-DO list</a></p>
  </div>
  <script src="currency-app.js"></script>
</body>
</html>
