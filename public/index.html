<!-- Main page markup for the TO-DO list app -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TO-DO List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="logo.svg" alt="Logo" class="logo" />
      <h1>TO-DO List</h1>
    </div>
    <form id="add-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off" required />
      <fieldset class="gender-group">
        <legend>Gender</legend>
        <label><input type="checkbox" name="gender" value="Male" /> Male</label>
        <label><input type="checkbox" name="gender" value="Female" /> Female</label>
        <label><input type="checkbox" name="gender" value="Other" /> Other</label>
      </fieldset>
      <fieldset class="answer-group">
        <legend>Yes/No</legend>
        <button type="button" id="answer-toggle" data-value="No">No</button>
      </fieldset>
      <button type="submit">Add</button>
    </form>
    <div class="number-buttons">
      <button type="button" class="number-btn">1</button>
      <button type="button" class="number-btn">2</button>
      <button type="button" class="number-btn">3</button>
      <button type="button" class="number-btn">4</button>
      <button type="button" class="number-btn">5</button>
      <button type="button" class="number-btn">6</button>
      <button type="button" class="number-btn">7</button>
      <button type="button" class="number-btn">8</button>
      <button type="button" class="number-btn">9</button>
      <button type="button" class="number-btn">10</button>
    </div>
    <ul id="todo-list"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
